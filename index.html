<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santiago Labarca</title>
  <meta name="description" content="Santiago Labarca: from Santiago, Chile to Berkeley Haas. Ex-founder, fintech operator, and builder of AI tools people use every day.">
  <meta property="og:title" content="Santiago Labarca">
  <meta property="og:description" content="Santiago → Mexico City → Berkeley. The journey, the numbers, and the things I build.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://santiagolabarca.vercel.app/assets/photo.jpg">
  <meta property="og:url" content="https://santiagolabarca.vercel.app">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0e0e0c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23ff5a1f'/><text x='16' y='22' font-family='Arial' font-weight='800' font-size='15' fill='black' text-anchor='middle'>SL</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="progress" aria-hidden="true"></div>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="brand">SL</a>
      <nav aria-label="Sections">
        <a href="#journey">Journey</a>
        <a href="#numbers">Numbers</a>
        <a href="#projects">Built</a>
        <a href="#off-clock">Off the clock</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to light mode">◐</button>
    </div>
  </header>

  <main id="top">
    <section class="wrap intro" id="intro"></section>

    <div class="strip-wrap" aria-hidden="true"><div class="strip"></div></div>

    <section class="wrap" id="journey" aria-labelledby="journey-title">
      <div class="section-head">
        <p class="eyebrow">2014 — today</p>
        <h2 id="journey-title">Five stops,<br>one through-line</h2>
      </div>
      <div class="journey"></div>
    </section>

    <section class="wrap section" id="numbers" aria-labelledby="numbers-title">
      <p class="eyebrow">For the skimmers</p>
      <h2 id="numbers-title">All the numbers</h2>
      <div class="numbers"></div>
    </section>

    <section class="wrap section" id="projects" aria-labelledby="proj-title">
      <p class="eyebrow">Things I've built</p>
      <h2 id="proj-title">What I build</h2>
      <div class="projects"></div>
    </section>

    <section class="wrap section" id="off-clock" aria-labelledby="off-title">
      <p class="eyebrow">Off the clock</p>
      <h2 id="off-title">Outside the résumé</h2>
      <div class="off-grid"></div>
      <div class="deck">
        <button type="button" class="deck-card" aria-label="Deal a random fact">
          <span class="deck-front">Pull a random fact<small>click anywhere here</small></span>
          <span class="deck-back"><span class="deck-text" aria-live="polite"></span></span>
        </button>
        <div class="deck-row"><button type="button" class="btn primary deck-deal">Another one</button><span class="deck-count"></span></div>
      </div>
    </section>

    <section class="wrap section" id="contact" aria-labelledby="contact-title"></section>
  </main>

  <footer class="wrap footer"></footer>

  <script src="/content.js"></script>
  <script src="/app.js"></script>
  <script src="/voice.js"></script>
</body>
</html>
